repos:
  - repo: [https://github.com/psf/black-pre-commit-mirror](https://github.com/psf/black-pre-commit-mirror)
    rev: 25.1.0
    hooks:
      - id: black

  - repo: [https://github.com/astral-sh/ruff-pre-commit](https://github.com/astral-sh/ruff-pre-commit)
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix]